# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_CONCURRENT_ID/$CI_PROJECT_PATH
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  CONTAINER_TEST_IMAGE: git.km3net.de:4567/km3py/km3io:test-$CI_COMMIT_REF_SLUG
  CONTAINER_RELEASE_IMAGE: git.km3net.de:4567/km3py/km3io:$CI_COMMIT_TAG
  CONTAINER_LATEST_IMAGE: git.km3net.de:4567/km3py/km3io:latest

cache:
  paths:
    - .cache/pip
  key: "$CI_COMMIT_REF_SLUG"

stages:
  - test
  - coverage
  - doc
  - docker
  - singularity
  - release

.virtualenv_template: &virtualenv_definition |
  python -V
  python3 -m venv venv
  source venv/bin/activate
  pip install -U pip setuptools wheel setuptools_scm
  hash -r
  pip freeze
  make install-dev
  pip freeze

.junit_template: &junit_definition
    artifacts:
      reports:
        junit: "reports/junit*.xml"

test-py3.9:
    image: git.km3net.de:4567/archive/docker-images/base/python:3.9
    stage: test
    script:
        - *virtualenv_definition
        - make test
    <<: *junit_definition

test-py3.10:
    image: git.km3net.de:4567/archive/docker-images/base/python:3.10
    stage: test
    script:
        - *virtualenv_definition
        - make test
    <<: *junit_definition

test-py3.11:
    image: git.km3net.de:4567/archive/docker-images/base/python:3.11
    stage: test
    script:
        - *virtualenv_definition
        - make test
    <<: *junit_definition

test-py3.12:
    image: git.km3net.de:4567/common/dockerfiles/base/python:3.12
    stage: test
    script:
        - *virtualenv_definition
        - make test
    <<: *junit_definition

code-style:
    image: git.km3net.de:4567/common/dockerfiles/base/python:3.12
    stage: test
    script:
        - *virtualenv_definition
        - make black
    allow_failure: true

coverage:
    image: git.km3net.de:4567/common/dockerfiles/base/python:3.12
    stage: coverage
    script:
        - *virtualenv_definition
        - make install-dev
        - "make test-cov|grep TOTAL| awk '{printf \"COVERAGE: %.2f%%\", (1-$3/$2)*100 }'"
    coverage: '/COVERAGE:\s*([0-9]*\.[0-9]*%)/'
    artifacts:
        paths:
            - reports/coverage


build-docs:
    image: git.km3net.de:4567/common/dockerfiles/base/python:3.12
    stage: doc
    script:
        - *virtualenv_definition
        - cd doc && make clean && make html
    cache: []

pages:
    image: git.km3net.de:4567/common/dockerfiles/base/python:3.12
    stage: doc
    script:
        - *virtualenv_definition
        - cd doc && make clean && make html
        - mv _build/html ../public/
        - cd .. && mv reports/coverage public/coverage
    artifacts:
        paths:
            - public
    cache: []
    only:
        - tags
        - master


docker:
  image: docker:stable
  services:
    - docker:dind
  stage: docker
  script:
    - docker build --pull -t $CONTAINER_TEST_IMAGE .
    - docker push $CONTAINER_TEST_IMAGE
  tags:
    - docker
  only:
    - tags

pypi:
    image: git.km3net.de:4567/common/dockerfiles/base/python:3.12
    stage: release
    cache: []
    script:
        - pip install -U twine wheel
        - python setup.py sdist
        - python setup.py bdist_wheel
        - twine upload dist/*
    only:
        - tags

release-docker:
  image: docker:stable
  services:
    - docker:dind
  stage: release
  script:
    - docker pull $CONTAINER_TEST_IMAGE
    - docker tag $CONTAINER_TEST_IMAGE $CONTAINER_RELEASE_IMAGE
    - docker tag $CONTAINER_TEST_IMAGE $CONTAINER_LATEST_IMAGE
    - docker push $CONTAINER_RELEASE_IMAGE
    - docker push $CONTAINER_LATEST_IMAGE
  tags:
    - docker
  only:
    - tags
